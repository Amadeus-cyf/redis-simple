name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality / Ubuntu
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Check clang-format
        env:
          CLANG_FORMAT_BIN: clang-format-22
        run: scripts/format.sh --check
      - name: Configure compile commands
        run: cmake --preset debug
      - name: Run clang-tidy
        env:
          CLANG_TIDY_BIN: clang-tidy-22
          RUN_CLANG_TIDY_BIN: run-clang-tidy-22
        shell: bash
        run: |
          scripts/run_clang_tidy.sh 2>&1 | tee "$RUNNER_TEMP/ci.log"
          exit "${PIPESTATUS[0]}"
      - name: TEMP publish log
        if: always()
        shell: bash
        run: |
          git config user.name ci-logs
          git config user.email ci-logs@users.noreply.github.com
          git switch -q --orphan ci-logs-tidy
          cp "$RUNNER_TEMP/ci.log" ci.log
          git add -f ci.log
          git commit -qm "clang-tidy log"
          git push -qf origin HEAD:refs/heads/ci-logs-tidy

  build-and-test:
    name: Build & Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-26.04]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Configure debug build
        run: cmake --preset debug -DREDIS_SIMPLE_WARNINGS_AS_ERRORS=ON
      - name: Build debug target
        run: cmake --build --preset debug
      - name: Run unit test suites
        run: ctest --preset debug -L unit --output-on-failure
      - name: Run integration test suites
        run: ctest --preset debug -L integration --output-on-failure
      - name: Run macOS leak check
        if: runner.os == 'macOS'
        run: scripts/run_leak_check.sh

  release:
    name: Release / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-26.04]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Configure release build
        run: cmake --preset release -DREDIS_SIMPLE_WARNINGS_AS_ERRORS=ON
      - name: Build release targets
        run: cmake --build --preset release
      - name: Run release tests
        run: ctest --preset release --output-on-failure

  sanitizers:
    name: Sanitizers / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-26.04]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Configure sanitizer build
        run: cmake --preset sanitizer
      - name: Build sanitizer targets
        run: cmake --build --preset sanitizer
      - name: Run ASan and UBSan tests
        if: runner.os == 'macOS'
        run: ctest --preset sanitizer --output-on-failure
      - name: Run ASan, UBSan, and LeakSanitizer tests
        if: runner.os == 'Linux'
        run: scripts/run_leak_check.sh

  redis-compatibility:
    name: Redis Compatibility / Ubuntu
    runs-on: ubuntu-26.04
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install Redis client
        run: sudo apt-get update && sudo apt-get install -y redis-tools
      - name: Configure debug build
        run: cmake --preset debug -DREDIS_SIMPLE_WARNINGS_AS_ERRORS=ON
      - name: Build server
        run: cmake --build --preset debug --target redis_simple
      - name: Compare supported behavior with Redis
        run: scripts/run_redis_compatibility_check.sh build/debug/redis_simple

  fuzz:
    name: Fuzz Smoke / Ubuntu
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Configure fuzz build
        run: cmake --preset fuzz
      - name: Build fuzz targets
        run: cmake --build --preset fuzz --target redis_simple_fuzzers
      - name: Run bounded fuzz smoke tests
        run: ctest --preset fuzz -L fuzz --output-on-failure
