name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality / Ubuntu
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Check clang-format
        env:
          CLANG_FORMAT_BIN: clang-format-22
        run: scripts/format.sh --check
      - name: Configure compile commands
        run: cmake --preset debug
      - name: Run clang-tidy
        env:
          CLANG_TIDY_BIN: clang-tidy-22
          RUN_CLANG_TIDY_BIN: run-clang-tidy-22
        run: scripts/run_clang_tidy.sh

  build-and-test:
    name: Build & Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-26.04]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Configure debug build
        run: cmake --preset debug -DREDIS_SIMPLE_WARNINGS_AS_ERRORS=ON
      - name: Build debug target
        run: cmake --build --preset debug
      - name: Run unit test suites
        run: ctest --preset debug -L unit --output-on-failure
      - name: Run integration test suites
        run: ctest --preset debug -L integration --output-on-failure
      - name: Run macOS leak check
        if: runner.os == 'macOS'
        run: scripts/run_leak_check.sh

  release:
    name: Release / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-26.04]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Configure release build
        run: cmake --preset release -DREDIS_SIMPLE_WARNINGS_AS_ERRORS=ON
      - name: Build release targets
        run: cmake --build --preset release
      - name: Run release tests
        run: ctest --preset release --output-on-failure

  sanitizers:
    name: Sanitizers / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-26.04]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Configure sanitizer build
        run: cmake --preset sanitizer
      - name: Build sanitizer targets
        run: cmake --build --preset sanitizer
      - name: Run ASan and UBSan tests
        if: runner.os == 'macOS'
        run: ctest --preset sanitizer --output-on-failure
      - name: Run ASan, UBSan, and LeakSanitizer tests
        if: runner.os == 'Linux'
        run: scripts/run_leak_check.sh

  thread-sanitizer:
    name: ThreadSanitizer / Ubuntu
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # Older ThreadSanitizer runtimes cannot map their shadow memory with the
      # kernel's default address randomization.
      - name: Limit address randomization for ThreadSanitizer
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure ThreadSanitizer build
        run: cmake --preset thread-sanitizer
      - name: Build ThreadSanitizer targets
        run: cmake --build --preset thread-sanitizer
      # Integration runners stop the server and fail on its exit status, so a
      # race in the server fails its test, not only one in a test binary.
      - name: Run ThreadSanitizer tests
        run: ctest --preset thread-sanitizer --output-on-failure

  redis-compatibility:
    name: Redis Compatibility / Ubuntu
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # The reference is always the latest stable Redis release, built from
      # source, so a new release is tested without a change here.
      - name: Find the latest Redis release
        id: redis
        run: echo "version=$(scripts/build_latest_redis.sh --print-version)" >> "$GITHUB_OUTPUT"
      - name: Restore the Redis build
        uses: actions/cache@v4
        with:
          path: build/reference-redis
          key: redis-${{ runner.os }}-${{ steps.redis.outputs.version }}
      - name: Build Redis ${{ steps.redis.outputs.version }}
        env:
          REDIS_VERSION: ${{ steps.redis.outputs.version }}
        run: |
          scripts/build_latest_redis.sh build/reference-redis
          echo "${PWD}/build/reference-redis/src" >> "$GITHUB_PATH"
      - name: Configure debug build
        run: cmake --preset debug -DREDIS_SIMPLE_WARNINGS_AS_ERRORS=ON
      - name: Build server
        run: cmake --build --preset debug --target redis_simple
      - name: Compare supported behavior with Redis
        run: |
          directory="$(mktemp -d)"
          redis-server --port 6379 --dir "${directory}" --save "" \
            --daemonize yes
          scripts/run_redis_compatibility_check.sh build/debug/redis_simple
          redis-cli -p 6379 shutdown nosave
      - name: Compare every command's replies
        run: scripts/compare_with_redis.py build/debug/redis_simple
      - name: Compare change counts and WATCH
        run: scripts/compare_side_effects.py build/debug/redis_simple
      - name: Check AOF interoperability
        run: scripts/check_aof_interop.sh build/debug/redis_simple
      - name: Check RDB interoperability
        run: scripts/check_rdb_interop.py build/debug/redis_simple

  fuzz:
    name: Fuzz Smoke / Ubuntu
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Configure fuzz build
        run: cmake --preset fuzz
      - name: Build fuzz targets
        run: cmake --build --preset fuzz --target redis_simple_fuzzers
      - name: Run bounded fuzz smoke tests
        run: ctest --preset fuzz -L fuzz --output-on-failure
